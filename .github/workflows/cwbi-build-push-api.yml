#This is a basic workflow to help you get started with Actions
name: Build/Push API to Dev, Test, or Prod

# Controls when the action will run. Invokes the workflow on push events but only for the main branch
on:
  push:
    branches: [cwbi-dev, cwbi-test, cwbi-prod]
    paths:
      - "services/api/**"
  workflow_dispatch:

env:
  AWS_REGION: us-gov-west-1
  PATH_TO_DOCKERFILE: services/api
  ECR_REPOSITORY: hhc-shared-api

# Permission can be added at job level or workflow level
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

# letting only one run or job in the group execute at a time
concurrency:
  group: build-hhcshare-api-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'cwbi-prod' }} # cancel currently executing run and pending if a new one starts

jobs:
  Build-Push-to-Env:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set branch attributes
        run: |
          case "$GITHUB_REF_NAME" in
            cwbi-dev)  ACCOUNT=718787032875; TAG=dev ;;
            cwbi-test) ACCOUNT=276847049069; TAG=test ;;
            cwbi-prod) ACCOUNT=648157167324; TAG=prod ;;
            *) echo "::error::Unsupported branch: $GITHUB_REF_NAME"; exit 1 ;;
          esac
          {
            echo "ROLE_TO_ASSUME=arn:aws-us-gov:iam::${ACCOUNT}:role/github-actions-ecr-hhc-shared"
            echo "IMAGE_TAG=${TAG}"
          } >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          role-session-name: gha-ldm-migration-${{ github.run_id }}

      - name: Verify identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.PATH_TO_DOCKERFILE }}
          push: true
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: ECR Logout
        if: always()
        run: docker logout ${{ steps.login-ecr.outputs.registry }}
